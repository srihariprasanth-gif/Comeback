<meta name="theme-color" content="#12181b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* Layout: a week as seven day rows; each row holds up to four habit cells (stacked on phones). */
:root{
  --bg:#f2f5f6; --surface:#fcfdfd; --surface2:#eaf0f1; --ink:#1f2b30; --muted:#5d6e75; --line:#dbe4e6;
  --accent:#2c7a7b; --accent-soft:#dcefee; --today:#2c7a7b;
  --c-main:#2c7a7b; --c-practice:#3d62a8; --c-recall:#a8742a; --c-sb:#7a58a5;
  --c-main-soft:#e0f0ef; --c-practice-soft:#e3eaf7; --c-recall-soft:#f6ecdc; --c-sb-soft:#ece5f5;
  --busy:#b5546a; --busy-soft:#f7e6ea; --ok:#2c7a7b;
  --shadow:0 1px 2px rgba(31,43,48,.06);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#192125; --surface2:#20292e; --ink:#e4ecee; --muted:#93a5ac; --line:#2b373c;
  --accent:#5cc0bf; --accent-soft:#1b3a3b; --today:#5cc0bf;
  --c-main:#5cc0bf; --c-practice:#8fb0ef; --c-recall:#e0b269; --c-sb:#bda0e6;
  --c-main-soft:#183334; --c-practice-soft:#1d2a45; --c-recall-soft:#3a2f1c; --c-sb-soft:#2c2340;
  --busy:#ee90a4; --busy-soft:#3d2229; --ok:#5cc0bf; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#192125; --surface2:#20292e; --ink:#e4ecee; --muted:#93a5ac; --line:#2b373c;
  --accent:#5cc0bf; --accent-soft:#1b3a3b; --today:#5cc0bf;
  --c-main:#5cc0bf; --c-practice:#8fb0ef; --c-recall:#e0b269; --c-sb:#bda0e6;
  --c-main-soft:#183334; --c-practice-soft:#1d2a45; --c-recall-soft:#3a2f1c; --c-sb-soft:#2c2340;
  --busy:#ee90a4; --busy-soft:#3d2229; --ok:#5cc0bf; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted);margin-left:8px}
.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:1.2rem;display:grid;place-items:center;flex:none}
.nav:hover{border-color:var(--accent)}
.nav[disabled]{opacity:.4;cursor:default}
.wk{flex:1 1 0;min-width:0}
.wk h1{margin:0;font-size:clamp(1.1rem,4.6vw,1.35rem);line-height:1.2;text-wrap:balance;font-variant-numeric:tabular-nums}
.wk .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 100%;min-width:0}
.tools select{flex:1 1 0;min-width:0;width:100%}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
select.btn{max-width:100%;padding-right:8px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.chip.tent{font-weight:500;color:var(--muted);border-style:dashed}
.chip.now{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.m-busy i{background:var(--busy)} .m-gate i{background:#3d62a8} .m-gateint i{background:#2a4a8a} .m-gatefinal i{background:#2a4a8a}
.m-window i{background:#7b8fb8} .m-recovery i{background:#6aa48a} .m-csir i{background:#2c7a7b} .m-csirint i{background:#1f5c5d} .m-csirfinal i{background:#1f5c5d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-gate i{background:#8fb0ef}:root:not([data-theme="light"]) .m-gateint i,:root:not([data-theme="light"]) .m-gatefinal i{background:#6f94e0}:root:not([data-theme="light"]) .m-csirint i,:root:not([data-theme="light"]) .m-csirfinal i{background:#7fd0cf}}
:root[data-theme="dark"] .m-gate i{background:#8fb0ef}:root[data-theme="dark"] .m-gateint i,:root[data-theme="dark"] .m-gatefinal i{background:#6f94e0}:root[data-theme="dark"] .m-csirint i,:root[data-theme="dark"] .m-csirfinal i{background:#7fd0cf}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.switch .tr{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{border-color:var(--busy);background:var(--busy-soft)}
.switch[aria-checked="true"] .tr{background:var(--busy)}
.switch[aria-checked="true"] .tr::after{transform:translateX(16px)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.9rem}
.note b{color:var(--ink);font-weight:600}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.day.today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dh .dn{font-weight:700;font-size:1.05rem}
.dh .dd{color:var(--muted);font-variant-numeric:tabular-nums}
.dh .tot{margin-left:auto;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.dh .tag{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bg);background:var(--today);border-radius:999px;padding:2px 9px}
.cells{display:grid;grid-template-columns:1fr;gap:8px}
.hab{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);min-width:0;--c:var(--c-main);--cs:var(--c-main-soft)}
.hab.k-practice{--c:var(--c-practice);--cs:var(--c-practice-soft)}
.hab.k-recall{--c:var(--c-recall);--cs:var(--c-recall-soft)}
.hab.k-sb{--c:var(--c-sb);--cs:var(--c-sb-soft)}
.hab.empty{display:none}
.hab.st-done,.hab.st-min{background:var(--cs);border-color:transparent}
.hab.st-rest{border-style:dashed;background:transparent}
.hab.st-rest .t,.hab.st-rest .d{color:var(--muted)}
.hab.opt{border-style:dashed}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px;padding:0;position:relative}
.chk::before{content:"";position:absolute;inset:-8px}
.chk svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.st-done .chk,.st-min .chk{background:var(--c)}
.st-done .chk svg,.st-min .chk svg{opacity:1}
.st-min .chk{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.st-min .chk svg{stroke:var(--ink);opacity:.0}
.st-rest .chk{border-style:dashed;opacity:.7}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.lbl em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:6px}
.t{font-weight:600;overflow-wrap:anywhere}
.d{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.mins{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:2px}
.mini{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.8rem;color:var(--muted);position:relative}
.mini::before{content:"";position:absolute;inset:-6px -2px}
.mini:hover{border-color:var(--c);color:var(--ink)}
.mini[aria-pressed="true"]{background:var(--surface);border-color:var(--c);color:var(--ink);font-weight:600}
.restday{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.restday b{color:var(--ink)}
.restday svg{width:22px;height:22px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{color:var(--muted);font-size:.82rem;padding:4px;display:flex;flex-direction:column;gap:4px}
@media (min-width:900px){
  .tools{flex:0 1 340px;margin-left:auto}
  .day{grid-template-columns:128px 1fr;gap:14px;padding:12px 14px;align-items:start}
  .dh{flex-direction:column;align-items:flex-start;gap:2px;padding-top:6px}
  .dh .tot{margin-left:0;margin-top:6px}
  .cells{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hab.empty{display:block;visibility:hidden;border:0;padding:0}
  .restday{grid-column:1/-1}
}
@media (pointer:coarse){.mini{min-height:40px;padding:0 14px}.mini::before{inset:-4px -2px}.chk{width:34px;height:34px}.chk::before{inset:-6px}.chk svg{width:18px;height:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><div class="brand">Study Rhythm<small>GATE 2027 · CSIR NET Dec 2027 · Systems Biology</small></div></div>
  <section class="weekbar" aria-label="Week navigation">
    <button class="nav" id="prev" aria-label="Previous week">‹</button>
    <div class="wk"><h1 id="range"></h1><div class="sub" id="sub"></div></div>
    <button class="nav" id="next" aria-label="Next week">›</button>
    <div class="tools">
      <button class="btn primary" id="today" hidden>This week</button>
      <select class="btn" id="jump" aria-label="Jump to a week"></select>
    </div>
  </section>
  <section class="banner">
    <div class="chips" id="chips"></div>
    <button class="switch" id="busy" role="switch" aria-checked="false"><span class="tr"></span><span>Busy week <small style="color:var(--muted)">(M.Sc. exams, practicals…)</small></span></button>
  </section>
  <div class="note" id="note" hidden></div>
  <main class="days" id="days"></main>
  <div class="foot">
    <div>Rest is part of the plan. A habit can be done, done in its minimum version, or skipped for rest; none of these is a miss.</div>
    <div id="saved">Checkmarks and Busy weeks are saved on this device only. They do not sync to other devices.</div><div id="ver"></div>
  </div>
</div>

 ['2027-06-23','2027-06-30','Phase III cumulative revision','30-day revision of March units; error-log review'],
 ['2027-07-01','2027-07-11','U6 Plant physiology','Hormone and mutant experiments; photosynthetic inhibitors'],
 ['2027-07-12','2027-07-22','U9 Evolution and diversity','Phylogeny reading; species-concept and taxonomy questions'],
 ['2027-07-23','2027-08-05','U7 Animal physiology','ECG, action-potential and kidney-clearance data'],

];
const unitFor = d => UN.find(u => d >= u[0] && d <= u[1]) || UN[UN.length-1];
const CT = {'2027-03-13':'Unit 1 test','2027-03-27':'Unit 2 test','2027-04-10':'Unit 3 test','2027-04-17':'Unit 4-A/B mini-test','2027-05-08':'Unit 4 test','2027-05-29':'Unit 8 test','2027-06-12':'Unit 5 test','2027-06-19':'Unit 11 test',
 '2027-06-26':'Part B mock #1 (50 Q, 70 min)','2027-07-10':'Unit 6 test','2027-07-17':'Unit 9 test','2027-07-24':'Mixed Part B + C test (60 Q)','2027-07-31':'Unit 7 test','2027-08-07':'Mixed Part B + C test (60 Q)','2027-08-14':'Unit 10 test','2027-08-21':'Mixed Part B + C test (60 Q)','2027-08-28':'Unit 12 test','2027-09-04':'Mixed Part B + C test (60 Q)','2027-09-11':'Unit 13 test','2027-09-18':'Mixed Part B + C test (60 Q)','2027-10-02':'Phase IV diagnostic (Part B 50 Q + Part C 25 Q)'};
const CUM = {'2027-06-30':1,'2027-07-31':1,'2027-08-31':1,'2027-09-30':1,'2027-10-30':1};
const cumRecall = () => H('recall','Monthly cumulative revision',90,{d:'Mixed timed paper on the month, error-log review, formula sheet from memory.',mt:'Error-log read-through only.',mm:30});
function csirStd(date,dow){
  const u = unitFor(date), c = [];
  const partA = () => H('recall','Part A set + 24-hour recap',30,{d:'15 min Part A, 15 min recap.',mt:'One 10-minute Part A set.',mm:10});
  const rr = () => H('recall','24-hour recap + error-log reattempt',30,{d:'Redo logged errors due today (R1 or R2).',mt:'Recap 3 points and redo 2 errors.',mm:10});
  const rec = (CUM[date] ? cumRecall() : null);
  if (dow<=3) c.push(H('main',u[2]+': concept block',90,{d:'One sub-block per day.',topic:u[2]}), H('practice','Unit MCQs, diagrams and flow-charts',30,{d:u[2],mt:'10 MCQs from today’s sub-block.',mm:15}), rec || ((dow===1||dow===3) ? rr() : partA()));
  if (dow===4) c.push(H('main',u[2]+': consolidation',60,{d:'Draw the pathway or cycle from memory.',topic:u[2]}), H('practice','Part C-style questions',60,{d:u[3],mt:'Two Part C questions.',mm:20}), rec || partA());
  if (dow===5) {
    const t = CT[date] ? CT[date]+(CT[date].indexOf('Q')<0 ? ' (30 Q, 45 min + 5 Part C)' : '') : 'Weekly unit check (30 Q, 45 min + 5 Part C)';
    const stats = (date>='2027-04-03' && date<='2027-05-31') ? ' Include a slice of 14I statistics.' : '';
    c.push(H('practice',t,90,{d:'Then one topic-wise PYQ set (45 min).'+stats,mt:'The 30-question test only.',mm:45}), CUM[date] ? cumRecall() : H('recall','Error analysis + 7-day revision',75,{d:'Tag every error; recall the week from headings; redo 5 logged errors.',mt:'Tag this week’s errors only.',mm:25}));
  }
  return c;
}
const R1 = [['','Units 1–3 (biomolecules, cell organization, fundamental processes)'],['','Unit 4 (signaling, immunology, host–pathogen, cancer)'],['','Units 5–7 (development, plant and animal physiology)']];
const R2 = ['Units 8 and 11 (inheritance, bioinformatics) and Red topics','Units 9, 10, 12 (evolution, ecology, biochemical engineering)','Units 13 and 14 (biotechnology, methods)'];
const R3 = [['Error log and formula sheets','Redo unretired C and CA questions; rewrite formula sheets from memory.'],['Short notes and concept maps','One page per unit; maps for Units 8–14.'],['Timing and Part C drills','Timed sets with a per-question cap and a skip rule.']];
function csirInt(date,dow,s){
  const c = [], pa = () => H('recall','Part A set + recap',30,{d:'15 min Part A, 15 min recap.',mt:'One 10-minute Part A set.',mm:10});
  if (s==='2027-11-29') { if (dow>4) return c; return [H('recall','Light recall of short notes',20,{d:'No new content this week.',mm:10}), H('practice','Light PYQ set',30,{opt:true,mm:15})]; }
  if (dow===0) c.push(H('main','Error-log repair',45,{d:'Top 3 weak topics from Saturday’s mock.',topic:'your weak topics',mm:20}), H('practice','PYQ reattempts or new PYQs',45,{mm:15}), H('recall','Mock analysis',75,{d:'Scorecard, time, tagged error log. (Moved from Sunday to protect your rest day.)',mt:'Tag the 10 costliest errors.',mm:30}));
  if (dow>=1 && dow<=3) {
    let t, d;
    if (date < '2027-11-01') { t = 'R1 · '+R1[dow-1][1]; d='Revision round R1.'; }
    else if (date < '2027-11-22') { t = 'R2 · '+R2[dow-1]; d='Revision round R2.'; }
    else { t = 'R3 · '+R3[dow-1][0]; d=R3[dow-1][1]; }
    c.push(H('main',t,75,{d:d,topic:t}), H('practice','PYQ reattempts and new PYQs',45,{mm:15}), pa());
  }
  if (dow===4) c.push(H('main','Weak-area repair',90,{d:'From the latest mock.',mm:30}), H('practice','Part C practice',60,{d:'Data, graph and experiment questions.',mt:'Two Part C questions.',mm:20}), H('recall','Error-log reattempts',15,{d:'R1, R2 and R3 as due.',mm:10}));
  if (dow===5) c.push(H('practice','Full-length mock (3 h)',180,{d:'In your real exam time slot once announced.',mt:'One half-paper, timed.',mm:90}));
  if (CUM[date] && dow!==0) { const i = c.findIndex(x => x.k==='recall'); if (i>=0) c[i] = cumRecall(); }
  return c;
}

/* ---------- build a day ---------- */
function busyDay(norm,dow,m){
  const mainH = norm.find(x => x.k==='main');
  const topic = mainH ? (mainH.topic || mainH.t) : 'this week’s topic';
  const c = [];
  if (dow===5) c.push(H('practice','Short timed set',30,{opt:true,d:'Optional. Skip the weekly test this week.',mm:15}), H('recall','7-day revision from headings',30,{d:'Recall the week from headings only.',mt:'Five headings, one line each.',mm:15}));
  else c.push(H('main','Skim: '+topic,15,{opt:true,d:'Optional. New topics are paused; nothing is lost.',mt:'Read one page.',mm:10}), H('practice','25 MCQs from your current topic',25,{d:'The minimum-viable day.',mt:'10 MCQs.',mm:10}), H('recall','Recall + error log',20,{d:'10 min recall of the 24-hour list, 10 min error log.',mt:'10 min recall only.',mm:10}));
  return c;
}
function dayPlan(i,dow){
  const m = meta(i), ms = T0 + (i*7+dow)*DAY, date = iso(ms), busy = !!S.busy[m.s];
  const out = { date, ms, dow, habits:[], rest:'', sbSlot:false, maint:false };
  if (dow===6) { out.rest = 'Rest and recovery. Nothing is scheduled today.'; return out; }
  if (m.mode==='gatefinal' && dow===4) { out.rest = 'Rest and logistics before your earliest possible slot (Sat 6 Feb, tentative).'; return out; }
  if (m.mode==='gatefinal' && dow===5) { out.rest = 'Possible GATE exam day (tentative). Check your admit card.'; return out; }
  if (m.mode==='window' && dow===5) { out.rest = 'Possible GATE exam day (tentative). Rest after your paper.'; return out; }
  let c = [];
  const g = G[m.s];
  if (m.mode==='gate') c = gateStd(g,dow,date);
  else if (m.mode==='gateint') c = (m.s==='2026-12-28') ? gateStd(g,dow,date) : gateInt(g,dow,date);
  else if (m.mode==='gatefinal') c = gateFinal(dow);
  else if (m.mode==='window') c = windowDay(dow);
  else if (m.mode==='recovery') c = recoveryDay(dow);
  else if (m.mode==='csir') c = csirStd(date,dow);
  else c = csirInt(date,dow,m.s);
  if (m.s==='2026-12-21' && dow===5) c[1] = H('recall','December cumulative revision + error analysis',90,{d:'Mixed timed set on the month, error-log review, formula sheet from memory. (Moved from Sunday.)',mt:'Error analysis only.',mm:25});
  if (m.s==='2026-12-07' && dow===5) out.note = g.satNote;
  if (busy) c = busyDay(c,dow,m);
  out.habits = c;
  if (m.sb.length) { if (!busy && m.sb.indexOf(dow)>=0) out.sbSlot = true; if (busy && dow===3) out.maint = true; }
  if (!c.length && !out.sbSlot && !out.maint) out.rest = (m.mode==='window'||m.mode==='gatefinal') ? 'Rest. Nothing is scheduled today.' : 'Rest and recovery. Nothing is scheduled today.';
  return out;
}

/* ---------- Systems Biology queue: keeps roadmap order, carries unfinished items forward ---------- */
let SBMAP = {};
function assignSB(){
  const done = new Set(), idx = {};
  SBQ.forEach((it,k) => idx[it.id] = k);
  Object.keys(S.d).forEach(d => { const x = S.d[d]; if (x && x.sb==='done' && x.sbi) done.add(x.sbi); });
  const avail = SBQ.filter(it => !done.has(it.id));
  let cur = 0; const seen = new Set(); SBMAP = {};
  for (let i=0;i<NW;i++) {
    const m = meta(i); if (!m.sb.length || S.busy[m.s]) continue;
    for (const dow of m.sb) {
      const date = iso(T0 + (i*7+dow)*DAY), st = S.d[date], rec = st && st.sbi ? SBQ[idx[st.sbi]] : null;
      if (st && st.sb && rec) {
        SBMAP[date] = {item:rec, carried:false};
        if (st.sb !== 'done') { const j = avail.indexOf(rec); if (j >= 0) cur = j; seen.add(rec.id); }
        continue;
      }
      const it = avail[cur]; if (!it) continue;
      SBMAP[date] = {item:it, carried:seen.has(it.id)}; seen.add(it.id);
      if (date >= todayIso) cur++;
    }
  }
}

/* ---------- rendering ---------- */
const LBL = {main:'Main exam study',practice:'Practice',recall:'Recall and revision',sb:'Systems Biology'};
const ICON_CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function stOf(date,k){ const x = S.d[date]; return x && x[k] ? x[k] : ''; }
function habHtml(h,date,dow){
  const st = stOf(date,h.k);
  const isMin = st==='min', isRest = st==='rest', isDone = st==='done';
  const title = isMin ? h.mt : h.t;
  const detail = isMin ? 'Minimum version' : h.d;
  const mins = isMin ? h.mm : h.m;
  let lbl = LBL[h.k];
  if (h.opt) lbl += '<em>optional</em>';
  if (h.carried) lbl += '<em>carried forward</em>';
  const stateTxt = isDone ? 'done' : isMin ? 'minimum version done' : isRest ? 'skipped for rest' : 'not done';
  return '<div class="hab k-'+h.k+' st-'+(st||'none')+(h.opt?' opt':'')+'" data-date="'+date+'" data-k="'+h.k+'"'+(h.id?' data-item="'+h.id+'"':'')+'>'
   + '<button class="chk" data-act="done" aria-pressed="'+isDone+'" aria-label="'+esc(LBL[h.k]+': '+h.t+' ('+stateTxt+')')+'">'+ICON_CHECK+'</button>'
   + '<div class="body"><div class="lbl">'+lbl+'</div><div class="t">'+esc(title)+'</div>'+(detail?'<div class="d">'+esc(detail)+'</div>':'')
   + '<div class="meta"><span class="mins">'+(isRest?'resting':'≈ '+mins+' min')+'</span>'
   + '<button class="mini" data-act="min" aria-pressed="'+isMin+'">Minimum · '+h.mm+' min</button>'
   + '<button class="mini" data-act="rest" aria-pressed="'+isRest+'">Rest</button></div></div></div>';
}
function dayHtml(p){
  const hs = p.habits.slice();
  if (p.sbSlot) { const a = SBMAP[p.date]; if (a) { const it = a.item; hs.push({k:'sb',t:it.x,d:'Week '+it.w+' · '+it.wt+(it.n>1?' · part '+it.p+' of '+it.n:''),m:it.m,mt:it.mv,mm:15,id:it.id,carried:a.carried}); } }
  if (p.maint) hs.push(H('sb','Maintenance: reread your last 10-line summary or rerun your last script',10,{opt:true,d:'Optional. Keeps the thread without moving your place.',mt:'Open your last notes for 5 minutes.',mm:5}));
  const tot = hs.reduce((a,h) => { if (h.opt) return a; const st = stOf(p.date,h.k); return a + (st==='rest' ? 0 : st==='min' ? h.mm : h.m); }, 0);
  const isToday = p.date===todayIso;
  let h = '<section class="day'+(isToday?' today':'')+'" aria-label="'+DN[p.dow]+' '+fmt(p.ms)+'"><div class="dh"><span class="dn">'+DN[p.dow]+'</span><span class="dd">'+fmt(p.ms)+'</span>'+(isToday?'<span class="tag">Today</span>':'')+(tot?'<span class="tot">≈ '+hm(tot)+'</span>':'')+'</div><div class="cells">';
  if (p.rest && !hs.length) h += '<div class="restday">'+ICON_MOON+'<div><b>Rest day.</b> '+esc(p.rest.replace(/^Rest and recovery\. /,'').replace(/^Rest\. /,''))+'</div></div>';
  else {
    ['main','practice','recall','sb'].forEach(k => { const x = hs.find(z => z.k===k); h += x ? habHtml(x,p.date,p.dow) : '<div class="hab empty" aria-hidden="true"></div>'; });
  }
  if (p.note) h += '<div class="note" style="grid-column:1/-1">'+esc(p.note)+'</div>';
  return h + '</div></section>';
}
let cur = 0;
const curNow = (() => { const t = parseIso(todayIso); const k = Math.floor((t - T0)/(7*DAY)); return (k>=0 && k<NW) ? k : -1; })();
function render(){
  assignSB();
  const m = meta(cur), a = T0 + cur*7*DAY, b = a + 6*DAY;
  const ya = new Date(a).getUTCFullYear(), yb = new Date(b).getUTCFullYear();
  document.getElementById('range').textContent = fmt(a)+(ya!==yb?' '+ya:'')+' – '+fmt(b)+' '+yb;
  document.getElementById('sub').textContent = 'Week '+(cur+1)+' of '+NW+' · '+(m.phase||'');
  const mo = MODES[S.busy[m.s] ? 'x' : m.mode];
  let chips = S.busy[m.s] ? '<span class="chip m-busy"><i></i>Busy week</span><span class="chip" style="font-weight:500;color:var(--muted)">was: '+MODES[m.mode].l+'</span>' : '<span class="chip '+mo.c+'"><i></i>'+mo.l+'</span>';
  if (m.tent) chips += '<span class="chip tent">Dates tentative</span>';
  if (cur===curNow) chips += '<span class="chip now">This week</span>';
  else if (curNow<0 && todayIso < iso(T0) && cur===0) chips += '<span class="chip now">Starts Mon 30 Nov</span>';
  document.getElementById('chips').innerHTML = chips;
  const sw = document.getElementById('busy'); sw.setAttribute('aria-checked', S.busy[m.s] ? 'true' : 'false');
  const nt = document.getElementById('note');
  let txt = '';
  if (S.busy[m.s]) txt = '<b>Busy week.</b> New topics are paused and each day is a short minimum-viable day (about 45 min). '+(m.sb.length ? 'Systems Biology is reduced to one optional 10-minute task; your lesson place does not move.' : 'Systems Biology stays paused.');
  else txt = m.note;
  nt.innerHTML = txt; nt.hidden = !txt;
  let h = ''; for (let d=0; d<7; d++) h += dayHtml(dayPlan(cur,d));
  document.getElementById('days').innerHTML = h;
  document.getElementById('prev').disabled = cur===0; document.getElementById('next').disabled = cur===NW-1;
  document.getElementById('jump').value = String(cur);
  document.getElementById('today').hidden = (curNow<0 || cur===curNow);
  try { sessionStorage.setItem('sr-week', String(cur)); } catch(e){}
}
function go(n){ cur = Math.max(0, Math.min(NW-1, n)); render(); window.scrollTo({top:0}); }

/* ---------- events ---------- */
document.getElementById('prev').onclick = () => go(cur-1);
document.getElementById('next').onclick = () => go(cur+1);
document.getElementById('today').onclick = () => go(curNow);
document.getElementById('jump').onchange = e => go(Number(e.target.value));
document.getElementById('busy').onclick = () => { const s = meta(cur).s; if (S.busy[s]) delete S.busy[s]; else S.busy[s] = 1; save(); render(); };
document.getElementById('days').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const cell = btn.closest('.hab'), date = cell.dataset.date, k = cell.dataset.k, act = btn.dataset.act;
  const x = S.d[date] || (S.d[date] = {});
  const target = act==='done' ? 'done' : act;
  if (x[k]===target) { delete x[k]; if (k==='sb') delete x.sbi; }
  else { x[k] = target; if (k==='sb' && cell.dataset.item) x.sbi = cell.dataset.item; }
  if (!Object.keys(x).filter(z => z!=='sbi').length) delete S.d[date];
  save(); const y = window.scrollY; render(); window.scrollTo({top:y});
});
document.addEventListener('keydown', e => {
  if (e.target.tagName==='SELECT' || e.target.tagName==='INPUT' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key==='ArrowLeft') go(cur-1); if (e.key==='ArrowRight') go(cur+1);
});

/* ---------- init ---------- */
(() => {
  let o = ''; for (let i=0;i<NW;i++) { const m = meta(i), a = T0+i*7*DAY; o += '<option value="'+i+'">Week '+(i+1)+' · '+fmt(a)+' – '+fmt(a+6*DAY)+' · '+MODES[m.mode].l+(i===curNow?' (now)':'')+'</option>'; }
  document.getElementById('jump').innerHTML = o;
  cur = curNow>=0 ? curNow : (todayIso > iso(T0 + (NW*7-1)*DAY) ? NW-1 : 0);
  render();
})();

document.getElementById('ver').textContent = 'Study Rhythm version ' + APP_VERSION;
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
document.addEventListener('visibilitychange', () => { if (!document.hidden && localIso() !== todayIso) location.reload(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
